<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CC Palette</title>
<style>
  :root {
    --bg: #18181b; --panel: #232328; --line: #34343b;
    --text: #e8e8ea; --muted: #9a9aa4; --accent: #7c5cff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --panel: #f5f5f7; --line: #e0e0e6;
      --text: #1c1c20; --muted: #6b6b76; --accent: #5b3fd6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font: 13px/1.45 system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 13px; margin: 0 0 2px; }
  p.sub { margin: 0 0 14px; color: var(--muted); font-size: 11px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 9px 10px; }
  legend { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row:last-child { margin-bottom: 0; }
  .row label { flex: 1; font-size: 12px; }
  .row input[type="color"] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--line);
    border-radius: 5px; background: none; cursor: pointer;
  }
  .row input[type="text"] {
    width: 82px; font: 11px ui-monospace, monospace; text-transform: uppercase;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
  }
  /* The uppercase above is for HEX fields. A palette name is lowercased when it
     is created, so uppercasing it here would show TERTIARY and make
     color.tertiary — same trap, different field. */
  .row input[type="text"].name {
    /* min-width:0 is load-bearing: an <input> has an intrinsic ~20ch width, so
       flex:1 will NOT shrink it below that and the row overflows the panel. */
    flex: 1; width: auto; min-width: 0; text-transform: lowercase;
    font: 12px system-ui, sans-serif;
  }
  .row > * { min-width: 0; }
  .note code { overflow-wrap: anywhere; }
  button {
    width: 100%; padding: 8px; margin-bottom: 6px; cursor: pointer;
    font: 600 12px system-ui, sans-serif;
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
  }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #out {
    margin-top: 10px; padding: 9px; min-height: 34px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    font: 11px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap;
  }
  details {
    border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 7px 10px;
  }
  details summary {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); cursor: pointer; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; }
  details[open] summary::before { content: '– '; }
  details[open] summary { margin-bottom: 8px; }
  .note { font-size: 10px; color: var(--muted); margin: 8px 2px 0; line-height: 1.4; }
</style>
</head>
<body>
  <p class="sub">Edit a seed — the ramp and every bound shape follow.</p>

  <fieldset><legend>Brand</legend><div id="brand"></div></fieldset>
  <details id="statusBox">
    <summary>Status</summary>
    <div id="status"></div>
  </details>

  <details id="addBox">
    <summary>Add a palette</summary>
    <div class="row">
      <input id="newName" class="name" type="text" placeholder="name (e.g. tertiary)" maxlength="20" autocapitalize="off" autocomplete="off" spellcheck="false">
      <input id="newHex" type="text" value="#3366FF" maxlength="7">
      <input id="newSwatch" type="color" value="#3366FF">
    </div>
    <button id="addPalette" class="secondary">Generate ramp + ladder</button>
    <p class="note">Seed + 12 ramp + 11 translucency steps. No semantic tokens.
      Keep it via <code>palettes</code> in the brand file.</p>
  </details>

  <button id="apply">Apply &amp; recompute</button>
  <button id="repaint" class="secondary">Repaint bound shapes</button>
  <button id="audit" class="secondary">Check for drift</button>

  <div id="out">Loading seeds…</div>
  <p class="note">An import updates values but never repaints — press Repaint after one.</p>

<script>
  /* Seeds arrive tagged with their role, so this file keeps no palette list —
     a brand with a 4th or 5th colour renders without touching the UI. */
  let seeds = [];

  const send = (msg) => parent.postMessage(msg, '*');

  const render = () => {
    for (const id of ['brand', 'status']) {
      const host = document.getElementById(id);
      host.innerHTML = '';
      const list = seeds.filter((s) => (s.role || 'brand') === id);
      for (const s of list) {
        const row = document.createElement('div');
        row.className = 'row';

        const label = document.createElement('label');
        label.textContent = s.name.replace('color.', '');

        const swatch = document.createElement('input');
        swatch.type = 'color';
        swatch.value = s.value;

        const hex = document.createElement('input');
        hex.type = 'text';
        hex.value = s.value;
        hex.maxLength = 7;

        /* Keep the two inputs in step, but only accept a complete hex — typing
           "#2" should not repaint anything. */
        swatch.addEventListener('input', () => { hex.value = swatch.value.toUpperCase(); s.value = hex.value; });
        hex.addEventListener('input', () => {
          const v = hex.value.trim().toUpperCase();
          if (/^#[0-9A-F]{6}$/.test(v)) { swatch.value = v; s.value = v; }
        });

        row.append(label, hex, swatch);
        host.appendChild(row);
      }
    }
  };

  const out = document.getElementById('out');
  const busy = (on) => ['apply', 'repaint', 'audit', 'addPalette'].forEach((id) => { document.getElementById(id).disabled = on; });

  const newName = document.getElementById('newName');
  const newHex = document.getElementById('newHex');
  const newSwatch = document.getElementById('newSwatch');
  newSwatch.addEventListener('input', () => { newHex.value = newSwatch.value.toUpperCase(); });
  newHex.addEventListener('input', () => {
    const v = newHex.value.trim().toUpperCase();
    if (/^#[0-9A-F]{6}$/.test(v)) newSwatch.value = v;
  });
  document.getElementById('addPalette').addEventListener('click', () => {
    const name = newName.value.trim();
    const hex = newHex.value.trim().toUpperCase();
    if (!name) { out.textContent = 'Give the palette a name.'; return; }
    if (!/^#[0-9A-F]{6}$/.test(hex)) { out.textContent = 'Need a 6-digit hex.'; return; }
    busy(true); out.textContent = 'Generating…';
    send({ type: 'addPalette', name, hex });
  });

  document.getElementById('apply').addEventListener('click', () => {
    busy(true); out.textContent = 'Recomputing…';
    send({ type: 'apply', seeds: Object.fromEntries(seeds.map((s) => [s.name, s.value])) });
  });
  document.getElementById('repaint').addEventListener('click', () => {
    busy(true); out.textContent = 'Repainting…';
    send({ type: 'repaint' });
  });
  document.getElementById('audit').addEventListener('click', () => {
    busy(true); out.textContent = 'Checking…';
    send({ type: 'audit' });
  });

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || !msg.type) return;
    if (msg.type === 'seeds') {
      seeds = msg.seeds;
      render();
      if (out.textContent === 'Loading seeds…') out.textContent = `${seeds.length} seeds loaded.`;
    }
    if (msg.type === 'result') { out.textContent = msg.text; busy(false); }
  });

  send({ type: 'ready' });
</script>
</body>
</html>
